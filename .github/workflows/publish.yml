name: Verify and publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: himti_kit_test
          POSTGRES_USER: himti
          POSTGRES_PASSWORD: himti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U himti -d himti_kit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://himti:himti@localhost:5432/himti_kit_test
      SESSION_SECRET: test-session-secret-at-least-32-characters
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run lint
      - run: npm run build

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=prod
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/himti-platform
            docker compose --profile prod pull himti-kit-prod
            docker compose --profile prod run --rm --no-deps himti-kit-prod node scripts/migrate.mjs
            docker compose --profile prod up -d --no-deps himti-kit-prod

            for attempt in $(seq 1 18); do
              container_id=$(docker compose --profile prod ps -q himti-kit-prod)
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
              [ "$status" = "healthy" ] && break
              [ "$status" = "unhealthy" ] && break
              sleep 5
            done

            if [ "$status" != "healthy" ]; then
              docker compose --profile prod logs --tail 100 himti-kit-prod
              exit 1
            fi

            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
              https://himtikit.himtibinus.or.id/ > /dev/null
