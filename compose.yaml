services:
  app:
    build:
      context: .
      target: development
    command: sh -c "npm run db:migrate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://himti:himti@db:5432/himti_kit
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: himti_kit
      POSTGRES_USER: himti
      POSTGRES_PASSWORD: himti
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himti -d himti_kit"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  node_modules:
  next_cache:
  postgres_data:
